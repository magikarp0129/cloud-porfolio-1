[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-portfolio-agents"
version = "0.1.0"
description = "Read-only incident evidence collector for the cloud portfolio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentctl = "cloud_portfolio_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

