template_version: "1.0"
template_purpose: operator_intake
agent_id: monitoring
default_adoption_level: "Level 1"

request:
  task: "<health review or incident analysis task>"
  objective: "<question the evidence should answer>"
  incident_ticket: "<INC-id or N/A for routine review>"

control:
  environment: "<dev|stg|prod>"
  mode: read
  change_ticket: "<incident or observation ticket>"
  data_classification: internal
  max_cost_usd: 1.00
  timeout_minutes: 15
  requester_team: "<requesting team>"
  cloud_mutation_allowed: false
  alarm_change_allowed: false

scope:
  repository: cloud-portfolio
  service: "<service name>"
  region: "<AWS region>"
  time_window:
    start_utc: "<RFC3339 timestamp>"
    end_utc: "<RFC3339 timestamp>"
  symptoms:
    - "<customer or system symptom>"
  incident_severity: "<critical|high|warning|info>"
  excluded_resources:
    - "<resources not authorized for query>"

inputs:
  alert_policy_version: "<approved monitoring alert policy version>"
  query_profile: "<resource-saturation|service-quality|eks-health|approved-custom>"
  requested_queries:
    - "<server-owned query catalog ID, for example host_cpu_utilization_percent>"
  deployment_markers:
    - "<change ID, version or timestamp>"
  known_baseline:
    - "<normal range or comparison period>"
  sanitized_evidence:
    - "<dashboard, metric or log reference; no secret/raw PII>"

questions:
  - "What facts changed relative to baseline and when?"
  - "Which hypotheses are supported or contradicted?"
  - "What evidence is missing before an operator acts?"

success_criteria:
  - "Every fact names its source, query ID and observation time."
  - "Every severity decision names its policy version, threshold, duration, sample count and missing-data treatment."
  - "Facts, hypotheses and recommended next queries are separated."

expected_output:
  - "timeline and impact summary"
  - "metric evaluation table: observed value, baseline, Warning/Critical condition, M/N or for duration, resulting severity"
  - "facts, unknowns and ranked hypotheses"
  - "operator checks, safe next query and handoff conditions"

operator_validation:
  - "Sample the original dashboard/query result and timestamp."
  - "Confirm account, region, service and time window before acting."

handoff:
  next_agents:
    - operations
    - security
  required_artifacts:
    - "evidence package with request_id and source timestamps"

query_profile_examples:
  resource_saturation:
    - host_cpu_utilization_percent
    - host_memory_utilization_percent
    - host_filesystem_utilization_percent
    - host_inode_utilization_percent
    - workload_cpu_request_utilization_percent
    - workload_memory_limit_utilization_percent
    - workload_cpu_throttling_percent
  service_quality:
    - alb_target_5xx_ratio_percent
    - service_request_latency_p95_seconds
  eks_health:
    - k8s_node_not_ready_count
    - monitoring_target_up
