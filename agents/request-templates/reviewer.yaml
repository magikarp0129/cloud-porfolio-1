template_version: "1.0"
template_purpose: operator_intake
agent_id: reviewer
default_adoption_level: "Level 1-2"

request:
  task: "<independent review task>"
  objective: "<release, architecture, policy or document decision to review>"
  business_context: "<risk and decision deadline>"

control:
  environment: "<organization|dev|stg|prod>"
  mode: review
  change_ticket: "<REV-or-CHG-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  artifact_mutation_allowed: false
  approval_authority_claimed: false

scope:
  repository: cloud-portfolio
  artifact_type: "<ADR|patch|plan|policy|runbook|incident report|documentation>"
  artifact_revision: "<commit, plan hash or immutable artifact ID>"
  review_domains:
    - "<correctness, security, availability, operations, cost, compliance>"
  excluded_domains:
    - "<explicitly assigned to another reviewer>"

inputs:
  requirements:
    - "<acceptance criterion or policy>"
  author_evidence:
    - "<test, plan, simulation, recovery or source evidence>"
  prior_findings:
    - "<finding and disposition if any>"

questions:
  - "Which claim lacks evidence or conflicts with implementation?"
  - "What failure mode, boundary or test is missing?"
  - "Is the rollback, ownership and residual risk decision adequate?"

success_criteria:
  - "Findings are reproducible, prioritized and tied to evidence."
  - "Blockers, recommendations and accepted residual risks are separated."

expected_output:
  - "finding ID, severity, evidence, impact and remediation"
  - "missing tests and operator verification"
  - "release recommendation: block, conditional or ready for human approval"

operator_validation:
  - "Reproduce blocker evidence and record finding disposition."
  - "Confirm the reviewer did not silently edit the artifact under review."

handoff:
  next_agents:
    - "<artifact owner agent>"
    - cicd
  required_artifacts:
    - "human disposition for every blocking finding"
