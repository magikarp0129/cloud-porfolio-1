template_version: "1.0"
template_purpose: operator_intake
agent_id: platform-manager
default_adoption_level: "Level 1"

request:
  task: "<cross-domain request to classify and coordinate>"
  objective: "<business or platform outcome>"
  business_context: "<why coordination is needed now>"

control:
  environment: "<organization|shared|dev|stg|prod>"
  mode: draft
  change_ticket: "<REQ-or-CHG-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  cloud_mutation_allowed: false

scope:
  repository: cloud-portfolio
  in_scope:
    - "<services, accounts, environments and decisions>"
  out_of_scope:
    - "<explicit non-goals>"

inputs:
  source_revision: "<branch or commit>"
  known_artifacts:
    - "<ticket, ADR, incident, plan or report>"
  constraints:
    - "<security, compliance, cost, time and production boundary>"

questions:
  - "Which functional team and primary Agent owns each workstream?"
  - "What dependencies, review gates and human decisions are required?"
  - "Which Security or Reviewer findings require independent escalation?"

success_criteria:
  - "Every workstream has a primary Agent, accountable human and completion criteria."
  - "Dependencies, handoffs, blockers and prohibited actions are explicit."
  - "No Agent is assigned production approval or direct mutation authority."

expected_output:
  - "request classification and work breakdown"
  - "Agent RACI, routing order and dependency map"
  - "handoff artifact checklist"
  - "blocker, escalation and human approval requirements"

operator_validation:
  - "Confirm domain owners and designated approvers accept the routing plan."
  - "Confirm Security and Reviewer retain independent reporting paths."
  - "Confirm the plan does not widen any Agent tool or credential boundary."

handoff:
  next_agents:
    - architecture
    - governance
    - security
    - terraform
    - operations
    - monitoring
    - finops
    - cicd
    - reviewer
    - documentation
  required_artifacts:
    - "approved work breakdown or recorded operator corrections"
