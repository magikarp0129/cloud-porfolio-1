template_version: "1.0"
template_purpose: operator_intake
agent_id: terraform
default_adoption_level: "Level 2"

request:
  task: "<Terraform change or analysis task>"
  objective: "<desired infrastructure outcome>"
  business_context: "<incident, requirement or lifecycle reason>"

control:
  environment: "<dev|stg|prod|organization>"
  mode: "<draft|plan>"
  change_ticket: "<CHG-id>"
  data_classification: internal
  max_cost_usd: 3.00
  timeout_minutes: 45
  requester_team: "<requesting team>"
  cloud_mutation_allowed: false
  merge_allowed: false

scope:
  repository: cloud-portfolio
  source_revision: "<branch or commit>"
  target_root: "<terraform root path>"
  target_modules:
    - "<module path>"
  protected_resources:
    - "<resources that must not be replaced or destroyed>"

inputs:
  current_state_evidence:
    - "<plan, state metadata or incident evidence link>"
  constraints:
    - "No direct apply or cloud API mutation."
    - "Do not change backend, provider ownership or CIDR unless explicitly in scope."
  expected_monthly_cost_change: "<estimate or unknown>"
  rollback_owner: "<team or on-call role>"

questions:
  - "Which files and state owner must change?"
  - "What create, update, replace or destroy actions are expected?"
  - "What security, availability and cost risks need review?"

success_criteria:
  - "The patch is minimal and follows existing module ownership."
  - "fmt, validate and applicable test results are recorded."
  - "Unexpected replace/destroy is reported as a blocker."

expected_output:
  - "changed file list and patch"
  - "fmt/validate/test evidence"
  - "speculative plan summary with plan hash when available"
  - "risk, rollback or forward-fix and post-deployment checks"

operator_validation:
  - "Review source revision, target workspace/account and variable inputs."
  - "Inspect the immutable plan rather than copying generated commands."

handoff:
  next_agents:
    - security
    - reviewer
    - cicd
  required_artifacts:
    - "reviewed patch"
    - "validated plan artifact"
