template_version: "1.0"
template_purpose: operator_intake
agent_id: architecture
default_adoption_level: "Level 1-2"

request:
  task: "<architecture decision or question>"
  objective: "<decision or target state to define>"
  business_context: "<why this decision is needed now>"

control:
  environment: "<organization|shared|dev|stg|prod>"
  mode: draft
  change_ticket: "<ADR-or-CHG-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  cloud_mutation_allowed: false

scope:
  repository: cloud-portfolio
  in_scope:
    - "<accounts, services, modules, integrations>"
  out_of_scope:
    - "<explicit non-goals>"

inputs:
  source_revision: "<branch or commit>"
  requirements:
    - "<functional and non-functional requirement>"
  constraints:
    - "<security, compliance, cost, RTO/RPO, delivery constraint>"
  existing_decisions:
    - "<ADR or architecture link>"

questions:
  - "What options satisfy the requirements and what are their trade-offs?"
  - "Where are the account, state and module ownership boundaries?"
  - "Which assumptions need validation before implementation?"

success_criteria:
  - "At least two viable options and a do-nothing option are compared."
  - "The recommendation states risks, assumptions and reversal conditions."

expected_output:
  - "ADR draft with context, options, decision and consequences"
  - "target/current boundary and ownership map"
  - "implementation sequence, decision gates and unresolved questions"

operator_validation:
  - "Confirm requirements and non-goals with service and security owners."
  - "Confirm the recommendation does not claim unimplemented controls."

handoff:
  next_agents:
    - governance
    - security
    - terraform
  required_artifacts:
    - "approved ADR or recorded decision"
