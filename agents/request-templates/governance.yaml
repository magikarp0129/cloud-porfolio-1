template_version: "1.0"
template_purpose: operator_intake
agent_id: governance
default_adoption_level: "Level 1-2"

request:
  task: "<governance policy question>"
  objective: "<control outcome to evaluate or design>"
  business_context: "<audit, compliance or platform requirement>"

control:
  environment: organization
  mode: "<read|draft|review>"
  change_ticket: "<GOV-or-CHG-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  organization_mutation_allowed: false
  policy_attachment_allowed: false

scope:
  repository: cloud-portfolio
  target_ous:
    - "<OU path>"
  target_accounts:
    - "<account alias or class; no credentials>"
  policy_types:
    - "<SCP|Tag Policy|Backup Policy|approval rule>"
  exceptions:
    - "<known exception and owner>"

inputs:
  requirements:
    - "<required allow/deny behavior>"
  existing_policies:
    - "<policy file or artifact>"
  evidence:
    - "<audit finding or service usage evidence>"

questions:
  - "Which principal, action, resource and condition are affected?"
  - "What legitimate workload could be denied?"
  - "How should Policy-Staging, exception and rollback work?"

success_criteria:
  - "The proposal states intended denies and likely false positives."
  - "Management account and break-glass boundaries are preserved."

expected_output:
  - "policy or control proposal"
  - "impact and conflict analysis"
  - "staged rollout, exception lifecycle and rollback plan"

operator_validation:
  - "Validate policy behavior with simulator or approved sandbox evidence."
  - "Confirm service last-accessed and exception owner before rollout."

handoff:
  next_agents:
    - security
    - reviewer
    - cicd
  required_artifacts:
    - "governance owner decision"
    - "Policy-Staging evidence"
