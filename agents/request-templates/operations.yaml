template_version: "1.0"
template_purpose: operator_intake
agent_id: operations
default_adoption_level: "Level 1-2"

request:
  task: "<backup, restore, patch, lifecycle or runbook task>"
  objective: "<operational outcome to assess or draft>"
  business_context: "<incident, maintenance or compliance reason>"

control:
  environment: "<dev|stg|prod>"
  mode: "<read|draft|review>"
  change_ticket: "<OPS-or-CHG-or-INC-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  cloud_mutation_allowed: false
  restart_failover_delete_allowed: false

scope:
  repository: cloud-portfolio
  services:
    - "<service or workload>"
  resources:
    - "<resource type and identifier class>"
  maintenance_window: "<UTC window or not scheduled>"
  operational_domain: "<backup|restore|patch|CVE|EOS|schedule|runbook>"

inputs:
  current_evidence:
    - "<backup job, version inventory, alarm or incident evidence>"
  rpo: "<required RPO or N/A>"
  rto: "<required RTO or N/A>"
  dependencies:
    - "<upstream/downstream dependency>"
  rollback_owner: "<team or on-call role>"

questions:
  - "What preconditions and stop conditions must the operator verify?"
  - "What is the blast radius and recovery path?"
  - "Which evidence proves completion rather than configuration only?"

success_criteria:
  - "The runbook separates preparation, execution, validation and recovery."
  - "RPO/RTO or lifecycle requirement is tied to measurable evidence."

expected_output:
  - "current-state gap and risk"
  - "operator runbook or change proposal"
  - "pre-check, stop, rollback and post-check list"

operator_validation:
  - "Confirm resource identity, dependency and recovery point before execution."
  - "Rehearse in an isolated or non-production target where applicable."

handoff:
  next_agents:
    - monitoring
    - security
    - reviewer
  required_artifacts:
    - "human-approved runbook and rollback owner"
