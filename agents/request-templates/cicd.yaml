template_version: "1.0"
template_purpose: operator_intake
agent_id: cicd
default_adoption_level: "Level 2"

request:
  task: "<pipeline or promotion control task>"
  objective: "<validation, approval or deployment workflow outcome>"
  business_context: "<delivery risk or compliance reason>"

control:
  environment: "<dev|stg|prod|organization>"
  mode: "<draft|review|plan>"
  change_ticket: "<CICD-or-CHG-id>"
  data_classification: internal
  max_cost_usd: 2.00
  timeout_minutes: 30
  requester_team: "<requesting team>"
  deployment_allowed: false
  approval_bypass_allowed: false

scope:
  repository: cloud-portfolio
  source_revision: "<branch or commit>"
  workflows:
    - "<workflow path or pipeline name>"
  target_roots:
    - "<Terraform or application deployment root>"

inputs:
  required_checks:
    - "<fmt, validate, test, scan, plan, drift or smoke test>"
  approval_requirements:
    - "<environment owner, two-person review, ticket or plan hash>"
  existing_artifacts:
    - "<run ID, plan hash, scan result or release record>"
  rollback_owner: "<team or role>"

questions:
  - "Can untrusted input alter credentials, target environment or executed command?"
  - "Are artifacts immutable and approvals bound to their hashes?"
  - "What prevents self-approval and environment promotion bypass?"

success_criteria:
  - "Identity, artifact, approval and environment gates are explicit."
  - "The workflow fails closed on missing or stale evidence."

expected_output:
  - "workflow patch or independent gate review"
  - "permission, secret, artifact and concurrency analysis"
  - "promotion, failure and rollback evidence requirements"

operator_validation:
  - "Inspect effective token permissions and environment protection rules."
  - "Confirm the approved plan hash matches the deployment artifact."

handoff:
  next_agents:
    - security
    - reviewer
  required_artifacts:
    - "human-approved workflow change"
