name: Operations Scripts Test

on:
  pull_request:
    paths:
      - "scripts/operations/**"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - "scripts/README.md"
      - ".github/workflows/operations-scripts-test.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate read-only operations scripts
        run: bash scripts/tests/validate-operations-scripts.sh
